
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Buddy 💜</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hearts">
    <span>💜</span>
    <span>✨</span>
    <span>💗</span>
    <span>⭐</span>
    <span>🌸</span>
    <span>💜</span>
</div>

<header>
    <div class="logo">💜 Formula Buddy</div>
    <div class="tag">✨ Learn • Practice • Remember ✨</div>
</header>

<main>

    <div class="welcome">
        <h1>Welcome to <span>Formula Buddy!</span> 💜</h1>
        <p>Your little space to learn maths in a fun way!</p>
    </div>

    <div class="character">🧸</div>

    <h2>What would you like to explore today? 🌷</h2>

    <div class="button-container">

        <button class="feature-btn visualizer"
        onclick="openPage('visualizer.html')">

            <span class="icon">📐</span>

            <span class="btn-title">Formula Visualizer</span>

            <span class="btn-description">
                See formulas come alive with visuals!
            </span>

            <span class="arrow">Explore Now →</span>

        </button>


        <button class="feature-btn flashcard"
        onclick="openPage('flashcard.html')">

            <span class="icon">🃏</span>

            <span class="btn-title">Flashcards</span>

            <span class="btn-description">
                Revise formulas and test your memory!
            </span>

            <span class="arrow">Start Learning →</span>

        </button>

    </div>

    <div class="bottom-text">
        Made with 💜 for Maths Lovers
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
